[project]
name = "pwmanager"
version = "0.1.0"
description = "Local, offline, single-user command-line password manager (coursework project)"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
pwm = "pwmanager.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
